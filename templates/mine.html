<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Thuwed Descendants Table</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; }
    table { border-collapse: collapse; margin: 2em auto; background: #fff; box-shadow: 0 2px 8px #ccc; }
    th, td { padding: 12px 16px; border: 1px solid #ddd; text-align: center; }
    th { background: #e0e0e0; }
    td {font-size: 0.8rem; font-style: italic;}
    tr:nth-child(even) { background: #f4f4f4; }
    img { max-width: 80px; max-height: 80px; object-fit: contain; display: block; margin: 0 auto 4px; border:1px solid #ccc; }
    .code { font-size: 1.1em; color: #555; margin-top: 4px; }
    caption { font-size: 1.3em; margin-bottom: 1em; }
  </style>
</head>
<body>
  <table>
    <caption>My Thuwed Descendants</caption>
    <thead>
      <tr>
        <th>Code</th>
        <th>Female</th>
        <th>Male</th>
      </tr>
    </thead>
    <tbody>
      %REPLACE%
    </tbody>
  </table>
</body>
</html>
